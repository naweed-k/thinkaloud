name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # If a new "-latest" image breaks CI, pin that one to a named image (ubuntu-24.04 and so on) until it's fixed.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22 is the floor in package.json "engines"; 24 is the newest LTS.
        node: [22, 24]
    steps:
      # Pinned to commits, because tags can move. The comment says which release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # Install the packed tarball the way a person would, into a folder with a space in its name.
      - name: Packed CLI smoke test
        shell: bash
        run: |
          # npm pack --json names the tarball, so a version bump needs no change here.
          tgz=$(npm pack --json --pack-destination "$RUNNER_TEMP" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename")
          mkdir -p "$RUNNER_TEMP/smoke test"
          cd "$RUNNER_TEMP/smoke test"
          # A relative path: on Windows npx mishandles an absolute path to a tarball.
          tgz="../$tgz"
          npx -y "$tgz" --version
          npx -y "$tgz" init ws -y --tools=claude,codex,antigravity
          npx -y "$tgz" doctor ws
          npx -y "$tgz" update ws
          npx -y "$tgz" budget ws
          test -f ws/.thinkaloud/manifest.json
          # Preflight on the planted-mistakes fixture: it must find them (exit 1), not crash (exit 2).
          node "$GITHUB_WORKSPACE/fixtures/make-vulnerable-app.mjs" app
          set +e
          npx -y "$tgz" preflight app --strictness=public
          code=$?
          set -e
          test "$code" = 1
          test -f app/PREFLIGHT.md
