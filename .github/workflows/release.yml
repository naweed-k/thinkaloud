name: Release

# Publishes to npm when a version tag (v1.0.0 and so on) is pushed. Nothing else triggers it.
#
# It uses npm trusted publishing: npm checks this workflow's identity, so no npm token is stored in the repo.
# Provenance (a signed link from the package to this commit and workflow) is added automatically.
# Set-up, once: publish the first version by hand, then on npmjs.com open the package's Settings → Trusted
# publishing, and add this repository and the workflow file name release.yml.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GitHub issue the identity token npm checks.
      id-token: write
    steps:
      # Pinned to commits, because tags can move. The comment says which release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # The tag must match package.json, so a typo can't publish the wrong version.
      - name: Tag matches package.json
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm is new enough
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"
      - run: npm test
      - run: npm publish
